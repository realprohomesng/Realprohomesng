<main class="rph-wrap"><section class="rph-card agent-login"><span class="rph-tag">PROPERTY PARTNERS</span><div id="forgot-panel"><h1>Forgot your password?</h1><p>Enter your registered email address to receive a password reset link.</p><form id="forgot-form" class="rph-form"><label>Email address<input type="email" name="email" maxlength="250" autocomplete="email" required></label><button class="rph-button">Send reset link</button></form></div><div id="reset-panel" hidden><h1>Choose a new password</h1><p>Your new password must contain at least 10 characters.</p><form id="reset-form" class="rph-form"><div class="rph-password-field"><label for="new-password">New password</label><div class="rph-password-wrap partner-password-wrap"><input id="new-password" type="password" name="password" minlength="10" maxlength="128" autocomplete="new-password" required><button class="partner-password-toggle" type="button" data-password-toggle="new-password" aria-controls="new-password" aria-pressed="false">Show password</button></div></div><div class="rph-password-field"><label for="confirm-password">Confirm new password</label><div class="rph-password-wrap partner-password-wrap"><input id="confirm-password" type="password" name="confirmation" minlength="10" maxlength="128" autocomplete="new-password" required><button class="partner-password-toggle" type="button" data-password-toggle="confirm-password" aria-controls="confirm-password" aria-pressed="false">Show password</button></div></div><button class="rph-button">Reset password</button></form><p><a href="reset-password.html">Request a new reset link</a></p></div><p id="reset-notice" class="rph-message" role="status"></p><p><a href="agent-dashboard.html">Back to sign in</a></p></section></main><script src="js/site.js"></script><script src="js/password-reset.js"></script></body></html>
